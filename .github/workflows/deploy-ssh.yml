name: Deploy
on:
  pull_request:
    branches:
      - 'release-*'
    types:
      - closed
  push:
    branches:
      - 'release-*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      BASE_PATH: weather-app-vue3

    name: Build And Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Use Node.js 18
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          eval $(ssh-agent -s)
          echo "${{ secrets.PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -H 146.59.87.169 >> ~/.ssh/known_hosts

      - name: Upload project files
        run: |
          rsync -avz --delete ./dist/ ciuser@146.59.87.169:/var/www/websites/production/darts-counter/
